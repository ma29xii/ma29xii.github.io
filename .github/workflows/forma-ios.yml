name: Forma iOS (IPA)

on:
  push:
    branches: ['claude/awesome-hypatia-tnhuis']
    paths: ['forma-ios/**', '!forma-ios/reviews/**', '!forma-ios/**/*.md', '.github/workflows/forma-ios.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forma-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: forma-ios
    steps:
      - uses: actions/checkout@v4

      - name: Neuestes Xcode wählen
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Xcode: $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: XcodeGen installieren und Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (iphoneos, Release, ohne Signatur)
        run: |
          set +e
          xcodebuild build \
            -project Forma.xcodeproj -scheme Forma -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          echo "=== ERRORS ==="
          grep -E "error:|error :" "$RUNNER_TEMP/build.log" | sed "s#$GITHUB_WORKSPACE/forma-ios/##" | sort -u | head -200
          echo "=== WARNINGS (Swift) ==="
          grep -E "\.swift:[0-9]+:[0-9]+: warning:" "$RUNNER_TEMP/build.log" | sed "s#$GITHUB_WORKSPACE/forma-ios/##" | sort -u | head -60
          echo "=== TAIL ==="
          tail -n 15 "$RUNNER_TEMP/build.log"
          exit $status

      - name: IPA packen
        run: |
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Forma.app"
          test -d "$APP"
          # Keine Schlüssel in der Standard-IPA (K-03-11).
          if find "$APP" -name 'coach-keys.json' | grep -q .; then echo "coach-keys.json im Paket!"; exit 1; fi
          # Ad-hoc-Signatur nur, damit App Group und Erweiterungen in der IPA stehen; Sideloadly signiert neu.
          EXT="$APP/PlugIns/HealthWidgets.appex"
          if [ -d "$EXT" ]; then
            test -f "$EXT/HealthWidgets"
            /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist"
            codesign --force --sign - --timestamp=none --entitlements HealthWidgets/HealthWidgets.entitlements "$EXT"
          else
            echo "::warning::HealthWidgets.appex fehlt im Build"
          fi
          /usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist" || echo "::warning::NSSupportsLiveActivities fehlt"
          codesign --force --sign - --timestamp=none --entitlements Forma/Resources/Forma.entitlements "$APP"
          codesign --verify --strict "$APP"
          codesign -d --entitlements - "$APP" || true
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa" && zip -qry Forma.ipa Payload
          unzip -Z1 Forma.ipa | grep -E 'PlugIns/.*appex/[^/]+$' | head -5 || true
          ls -lh "$RUNNER_TEMP/ipa/Forma.ipa"

      - name: Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Forma-IPA
          path: ${{ runner.temp }}/ipa/Forma.ipa
          if-no-files-found: error
          retention-days: 30

  screens:
    # Unit-Tests (müssen grün sein) und Screenshots für die Design-Prüfung (dürfen scheitern).
    # Läuft nach dem IPA-Build: Das Konto bekommt offenbar nicht zuverlässig zwei Mac-Runner gleichzeitig,
    # und die IPA ist das Wichtigste.
    needs: ipa
    if: always() && needs.ipa.result != 'cancelled'
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: forma-ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode und Projekt
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)"
          brew install xcodegen
          xcodegen generate

      - name: Simulator starten
        run: |
          RT=$(xcrun simctl list runtimes available | grep -oE 'iOS [0-9.]+' | sort -V | tail -n 1 | cut -d' ' -f2)
          echo "Runtime: $RT"
          UDID=$(xcrun simctl list devices available | awk -v rt="-- iOS $RT --" '$0==rt{f=1;next} /^--/{f=0} f && /iPhone 17 Pro \(/{print; exit}' | grep -oE '[0-9A-F-]{36}')
          [ -z "$UDID" ] && UDID=$(xcrun simctl list devices available | awk -v rt="-- iOS $RT --" '$0==rt{f=1;next} /^--/{f=0} f && /iPhone/{print; exit}' | grep -oE '[0-9A-F-]{36}')
          echo "Simulator: $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl ui "$UDID" appearance dark || true

      - name: Unit-Tests
        run: |
          set +e
          xcodebuild test -project Forma.xcodeproj -scheme Forma -only-testing:FormaTests \
            -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" > "$RUNNER_TEMP/unit.log" 2>&1
          status=$?
          echo "=== Fehlgeschlagene Unit-Tests ==="
          grep -E "error: -\[|Test Case .* failed" "$RUNNER_TEMP/unit.log" | sed "s#$GITHUB_WORKSPACE/forma-ios/##" | head -40
          echo "=== Übersicht ==="
          grep -E "Executed [0-9]+ test|TEST (SUCCEEDED|FAILED)" "$RUNNER_TEMP/unit.log" | tail -3
          {
            echo "### Unit-Tests"
            grep -E "Executed [0-9]+ test" "$RUNNER_TEMP/unit.log" | tail -1
            grep -E "Test Case .* failed|error:" "$RUNNER_TEMP/unit.log" | sed "s#$GITHUB_WORKSPACE/forma-ios/##" | head -40
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: UI-Rundgang
        if: always()
        run: |
          set +e
          # Ohne Bildschirmvideo: es bremst den Simulator, die Screenshots hängt der Rundgang selbst an.
          xcodebuild test -project Forma.xcodeproj -scheme Forma -only-testing:FormaUITests \
            -collect-test-diagnostics never \
            -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" > "$RUNNER_TEMP/ui.log" 2>&1
          status=$?
          grep -E "error:|failed|Executed|TEST (SUCCEEDED|FAILED)" "$RUNNER_TEMP/ui.log" | sed "s#$GITHUB_WORKSPACE/forma-ios/##" | sort -u | head -60
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path "$RUNNER_TEMP/shots" > /dev/null 2>&1
          ls "$RUNNER_TEMP/shots" | head -40
          echo "UI_STATUS=$status" >> "$GITHUB_ENV"
          exit 0

      - name: Screenshots als Artifact (auch bei Fehlern)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Health-Screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 7
          if-no-files-found: ignore

      - name: Screenshots in den Branch legen
        if: always()
        continue-on-error: true
        run: |
          cd "$RUNNER_TEMP/shots" || exit 0
          [ -f manifest.json ] || exit 0
          # Erst in einen Zwischenordner, nur bei vollständigem Satz veröffentlichen (Codex R-02-23/A-32).
          OUT="$RUNNER_TEMP/screens-new"
          rm -rf "$OUT"; mkdir -p "$OUT"
          python3 - "$OUT" <<'PY'
          import json, os, re, subprocess, sys
          out = sys.argv[1]
          found = []
          def walk(n):
              if isinstance(n, dict):
                  if "exportedFileName" in n:
                      found.append((n.get("suggestedHumanReadableName") or n["exportedFileName"], n["exportedFileName"]))
                  for v in n.values(): walk(v)
              elif isinstance(n, list):
                  for v in n: walk(v)
          walk(json.load(open("manifest.json")))
          for name, f in found:
              if not f.lower().endswith((".png", ".jpg", ".jpeg", ".heic")): continue
              clean = re.sub(r"[^0-9A-Za-zäöüÄÖÜß -]", "", name.split("_")[0]).strip().replace(" ", "-") or f
              subprocess.run(["sips", "-s", "format", "jpeg", "-s", "formatOptions", "70", "-Z", "1000", f, "--out", os.path.join(out, clean + ".jpg")],
                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          PY
          ls -la "$OUT"
          REQUIRED="01-Today 03-Mein-Tag 04-Recovery 06-Sleep 08-Strain 08b-Schritte 08c-Health-Monitor 08d-Stress-Monitor 08e-Strain-Trend 09-Training 10-Live-Training 11-Pause 13-Zusammenfassung 14-Health 14b-Health-Age 14c-Health-bearbeiten 14d-Alterungstempo 14e-Health-Age-Trend 14f-Health-Monitor 15-HRV 16-Coach 19-Profil 20-Body"
          MISSING=""
          for r in $REQUIRED; do [ -f "$OUT/$r.jpg" ] || MISSING="$MISSING $r"; done
          if [ -n "$MISSING" ]; then
            echo "### Screenshots NICHT veröffentlicht – Pflichtbilder fehlen:$MISSING" >> "$GITHUB_STEP_SUMMARY"
            echo "Pflichtbilder fehlen:$MISSING"; exit 1
          fi
          rm -rf "$GITHUB_WORKSPACE/docs/forma-screens" && mkdir -p "$GITHUB_WORKSPACE/docs/forma-screens"
          cp "$OUT"/*.jpg "$GITHUB_WORKSPACE/docs/forma-screens/"
          echo "Build $GITHUB_SHA · Lauf $GITHUB_RUN_ID · $(date -u +%Y-%m-%dT%H:%MZ)" > "$GITHUB_WORKSPACE/docs/forma-screens/HERKUNFT.txt"
          cd "$GITHUB_WORKSPACE"
          git config user.name "forma-ci"
          git config user.email "forma-ci@users.noreply.github.com"
          git add docs/forma-screens
          git commit -q -m "Forma: Screenshots aus dem UI-Rundgang ($GITHUB_SHA, Lauf $GITHUB_RUN_ID)" || exit 0
          for i in 1 2 3; do git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 5; done

      - name: UI-Rundgang-Ergebnis
        if: always()
        run: |
          if [ "${UI_STATUS:-1}" != "0" ]; then echo "UI-Rundgang fehlgeschlagen (Status ${UI_STATUS:-unbekannt})"; exit 1; fi
