name: iOS Build & Test

on:
  push:
    branches: ['claude/**']
    paths: ['Stetig/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  DESTINATION: platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Stetig
    steps:
      - uses: actions/checkout@v4

      - name: Simulator vorab starten
        run: |
          UDID=$(xcrun simctl list devices available | awk '/-- iOS 26.5 --/{f=1;next} /^--/{f=0} f && /iPhone 17 Pro \(/{print; exit}' | grep -oE '[0-9A-F-]{36}')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true

      - name: Build (App, Widgets, Tests)
        run: |
          set +e
          xcodebuild build-for-testing \
            -project Stetig.xcodeproj -scheme Stetig \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/dd" > "$RUNNER_TEMP/build.log" 2>&1
          status=$?
          echo "=== ERRORS ==="
          grep -E "error:|error :" "$RUNNER_TEMP/build.log" | sed "s#$GITHUB_WORKSPACE/Stetig/##" | sort -u | head -150
          echo "=== WARNINGS ==="
          grep -E "\.swift:[0-9]+:[0-9]+: warning:" "$RUNNER_TEMP/build.log" | sed "s#$GITHUB_WORKSPACE/Stetig/##" | sort -u | head -40
          echo "=== TAIL ==="
          tail -n 12 "$RUNNER_TEMP/build.log"
          exit $status

      - name: Unit-Tests
        run: |
          set +e
          xcodebuild test-without-building \
            -project Stetig.xcodeproj -scheme Stetig \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -only-testing:StetigTests > "$RUNNER_TEMP/unit.log" 2>&1
          status=$?
          echo "=== FAILURES ==="
          grep -E "error:|failed|✘|recorded an issue|Fatal|crash" "$RUNNER_TEMP/unit.log" | sed "s#$GITHUB_WORKSPACE/Stetig/##" | sort -u | head -80
          echo "=== SUMMARY ==="
          grep -E "Test run with|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED|EXECUTE)" "$RUNNER_TEMP/unit.log" | tail -n 8
          exit $status

      - name: UI-Tests (mit Screenshots)
        run: |
          set +e
          xcodebuild test-without-building \
            -project Stetig.xcodeproj -scheme Stetig \
            -destination "$DESTINATION" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            -only-testing:StetigUITests > "$RUNNER_TEMP/ui.log" 2>&1
          status=$?
          echo "=== FAILURES ==="
          grep -E "error:|failed|Fatal|crash|Assertion" "$RUNNER_TEMP/ui.log" | sed "s#$GITHUB_WORKSPACE/Stetig/##" | sort -u | head -80
          echo "=== SUMMARY ==="
          grep -E "Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED|EXECUTE)|Test Case .* (passed|failed)" "$RUNNER_TEMP/ui.log" | tail -n 30
          echo "=== UI-HIERARCHIE (nur bei Fehlern) ==="
          awk '/UI-HIERARCHIE-BEGINN/{f=1} f{print} /UI-HIERARCHIE-ENDE/{f=0}' "$RUNNER_TEMP/ui.log" | head -n 320
          mkdir -p "$RUNNER_TEMP/shots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/ui.xcresult" --output-path "$RUNNER_TEMP/shots" > /dev/null 2>&1 || true
          ls "$RUNNER_TEMP/shots" | wc -l
          exit $status

      - name: Screenshots ins Log (verkleinert)
        if: always()
        run: |
          cd "$RUNNER_TEMP/shots" 2>/dev/null || exit 0
          [ -f manifest.json ] || exit 0
          mkdir -p "$RUNNER_TEMP/small"
          python3 - "$RUNNER_TEMP/small" <<'PY'
          import base64, json, os, subprocess, sys
          out = sys.argv[1]
          found = []
          def walk(node):
              if isinstance(node, dict):
                  if "exportedFileName" in node:
                      found.append((node.get("suggestedHumanReadableName") or node["exportedFileName"], node["exportedFileName"]))
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
          walk(json.load(open("manifest.json")))
          for name, file in sorted(found):
              if not file.lower().endswith((".png", ".jpg", ".jpeg", ".heic")):
                  continue
              target = os.path.join(out, file + ".jpg")
              subprocess.run(["sips", "-s", "format", "jpeg", "-s", "formatOptions", "62", "-Z", "1100", file, "--out", target],
                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if not os.path.exists(target):
                  continue
              data = base64.b64encode(open(target, "rb").read()).decode()
              print(f"SHOT-BEGIN {name}")
              for i in range(0, len(data), 4000):
                  print("SHOT|" + data[i:i + 4000])
              print("SHOT-END")
          PY

      - name: Geräte-Build (Release, arm64, ohne Signatur)
        if: always()
        run: |
          set +e
          xcodebuild build \
            -project Stetig.xcodeproj -scheme Stetig -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd-device" \
            CODE_SIGNING_ALLOWED=NO > "$RUNNER_TEMP/device.log" 2>&1
          status=$?
          echo "=== ERRORS ==="
          grep -E "error:|error :" "$RUNNER_TEMP/device.log" | sed "s#$GITHUB_WORKSPACE/Stetig/##" | sort -u | head -80
          echo "=== TAIL ==="
          tail -n 6 "$RUNNER_TEMP/device.log"
          ls "$RUNNER_TEMP/dd-device/Build/Products/Release-iphoneos" 2>/dev/null | head
          exit $status

      - name: IPA verpacken (für Sideloadly)
        if: always()
        run: |
          APP="$RUNNER_TEMP/dd-device/Build/Products/Release-iphoneos/Stetig.app"
          [ -d "$APP" ] || { echo "Kein Geräte-Build vorhanden"; exit 1; }
          # App-Group-ID aus den Build-Einstellungen in die Entitlements einsetzen (Variablen werden ohne Signatur nicht ersetzt).
          GROUP=$(xcodebuild -project Stetig.xcodeproj -scheme Stetig -configuration Release -showBuildSettings 2>/dev/null | awk -F' = ' '/ APP_GROUP_ID = /{print $2; exit}')
          echo "App-Group: $GROUP"
          for f in Stetig Widgets; do
            sed "s#\$(APP_GROUP_ID)#$GROUP#" "Config/$f.entitlements" > "$RUNNER_TEMP/$f.entitlements"
          done
          # Ad-hoc-Signatur nur, damit die Entitlements in der App stecken; Sideloadly signiert neu.
          if [ -d "$APP/PlugIns/StetigWidgets.appex" ]; then
            codesign --force --sign - --timestamp=none --entitlements "$RUNNER_TEMP/Widgets.entitlements" "$APP/PlugIns/StetigWidgets.appex"
          fi
          codesign --force --sign - --timestamp=none --entitlements "$RUNNER_TEMP/Stetig.entitlements" "$APP"
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry Stetig.ipa Payload)
          ls -lh "$RUNNER_TEMP/ipa/Stetig.ipa"

      - name: IPA hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Stetig-IPA
          path: ${{ runner.temp }}/ipa/Stetig.ipa
          if-no-files-found: warn
          retention-days: 30

      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 14
