name: Forma
options:
  bundleIdPrefix: com.ma29xii
  developmentLanguage: de
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
targets:
  Forma:
    type: application
    platform: iOS
    sources:
      - path: Forma
        excludes:
          - coach-keys.json
          - "**/coach-keys.json"
      - path: Shared
    dependencies:
      - target: HealthWidgets
        link: false
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ma29xii.forma
        PRODUCT_NAME: Forma
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Forma/Resources/Info.plist
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        CODE_SIGN_ENTITLEMENTS: Forma/Resources/Forma.entitlements
  HealthWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HealthWidgets
        excludes:
          - Info.plist
          - HealthWidgets.entitlements
      - path: Shared
        excludes:
          - HealthShortcuts.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ma29xii.forma.widgets
        PRODUCT_NAME: HealthWidgets
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: HealthWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: HealthWidgets/HealthWidgets.entitlements
        SKIP_INSTALL: YES
  FormaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FormaTests
    dependencies:
      - target: Forma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ma29xii.forma.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Forma.app/Forma"
        BUNDLE_LOADER: "$(TEST_HOST)"
  FormaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FormaUITests
    dependencies:
      - target: Forma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ma29xii.forma.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Forma
schemes:
  Forma:
    build:
      targets:
        Forma: all
        FormaTests: [test]
        FormaUITests: [test]
    test:
      targets:
        - FormaTests
        - FormaUITests
